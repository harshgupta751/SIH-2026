version: '3.8'

services:
  mahasetu-postgres:
    image: postgres:15-alpine
    container_name: mahasetu-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mahasetu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mahasetu-redis:
    image: redis:7-alpine
    container_name: mahasetu-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
